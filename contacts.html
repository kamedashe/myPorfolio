<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти — Богдан Бецков</title>
  <meta name="description" content="Зв'яжіться з Богданом Бецковим — email, Telegram, GitHub. Форма зворотного зв'язку.">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- ===== HEADER / NAVBAR ===== -->
  <nav class="navbar navbar-expand-md navbar-light bg-white py-3">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="mainNav">
        <ul class="navbar-nav gap-lg-4">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Головна</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#experience">Досвід</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="projects.html">Проєкти</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contacts.html">Контакти</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="flex-grow-1">
    <section class="contacts-section">
      <div class="container">
        <div class="row g-5">

          <!-- Left column: contact info -->
          <div class="col-lg-6">
            <h1>Давай співпрацювати!</h1>
            <div class="contact-info">
              <p><strong>Email:</strong> <a href="mailto:beckovbogdan@gmail.com">beckovbogdan@gmail.com</a></p>
              <p><strong>Telegram:</strong> <a href="https://t.me/dreamotearz" target="_blank" rel="noopener noreferrer">@dreamotearz</a></p>
              <p><strong>GitHub:</strong> <a href="https://github.com/kamedashe" target="_blank" rel="noopener noreferrer">github.com/kamedashe</a></p>
            </div>
          </div>

          <!-- Right column: contact form -->
          <div class="col-lg-6">
            <form action="#" method="POST" class="contact-form">
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label for="contactName" class="visually-hidden">Ваше ім'я</label>
                  <input type="text" class="form-control" id="contactName" name="name" placeholder="Ваше ім'я" required>
                </div>
                <div class="col-sm-6">
                  <label for="contactEmail" class="visually-hidden">Ваш Email</label>
                  <input type="email" class="form-control" id="contactEmail" name="email" placeholder="Ваш Email" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="contactMessage" class="visually-hidden">Повідомлення</label>
                <textarea class="form-control" id="contactMessage" name="message" placeholder="Повідомлення..." required></textarea>
              </div>
              <button type="submit" class="btn btn-dark">Відправити</button>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="mt-auto py-3 text-center">
    &copy; 2026 Bogdan Betskov
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous">
