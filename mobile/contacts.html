<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти — Богдан Бецков</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="mobile-header">
    Контакти
  </header>

  <main class="container">
    <section class="contacts-section">
      <div class="contact-info">
        <p>
          <strong>Email:</strong> 
          <a href="mailto:beckovbogdan@gmail.com">beckovbogdan@gmail.com</a>
        </p>
        <p>
          <strong>Телефон:</strong> 
          <!-- Phone number is active via tel: link -->
          <a href="tel:+380991234567">+38 (099) 123-45-67</a>
        </p>
        <p>
          <strong>Telegram:</strong> 
          <a href="https://t.me/dreamotearz" target="_blank" rel="noopener noreferrer">@dreamotearz</a>
        </p>
      </div>

      <!-- Contact Form -->
      <form action="#" method="POST" class="contact-form">
        <div class="mb-3">
          <label for="contactName" class="visually-hidden">Ваше ім'я</label>
          <!-- Using autocomplete attribute -->
          <input type="text" class="form-control" id="contactName" name="name" placeholder="Ваше ім'я" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label for="contactEmail" class="visually-hidden">Ваш Email</label>
          <!-- Using autocomplete attribute -->
          <input type="email" class="form-control" id="contactEmail" name="email" placeholder="Ваш Email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="contactMessage" class="visually-hidden">Повідомлення</label>
          <textarea class="form-control" id="contactMessage" name="message" placeholder="Повідомлення..." required></textarea>
        </div>
        <button type="submit" class="btn btn-dark w-100">Відправити</button>
      </form>
    </section>
  </main>

  <!-- Bottom Navigation Menu -->
  <nav class="bottom-nav">

    <a class="nav-link" href="projects.html">Проєкти</a>
    <a class="nav-link active" href="contacts.html">Контакти</a>
  </nav>

</body>
</html>
